# 7sProMax + original BLE Micro Pro (non-boost) x2, ZMK v0.3
# Mirrors the verified Corne v2 BMP config, with the standard ZMK
# underglow engine instead of the Corne custom lighting engine.

CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

# Per-half WS2812/SK6812 chain (16 LEDs, data on Pro Micro TX0 = P0.11,
# strip node is defined in 7spromax.keymap). Standard underglow drives
# it; state syncs to the peripheral over the split link.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_LED_STRIP=y
CONFIG_SPI=y
CONFIG_WS2812_STRIP=y
CONFIG_WS2812_STRIP_SPI=y

# Runtime settings are owned by the central half and exposed through
# ZMK Studio (custom-settings module, same as the Corne v2 BMP build).
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_SPLIT_RELAY_EVENT=y

# Keep ZMK Studio available immediately after boot. ZMK_STUDIO_RPC
# normally implies locking on hardware builds, but an explicit n
# overrides that imply.
CONFIG_ZMK_STUDIO_LOCKING=n

# Keep the stock small relay payload (same value as the Corne build).
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=14

CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048
