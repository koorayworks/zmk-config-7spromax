# SuperMini nRF52840 (nice_nano board) only.
#
# The matrix uses Pro Micro D16 as a column line, which is nRF
# P0.10 -- an NFC pin by default. Without this, that column stays
# routed to the NFC peripheral and never scans. This makes Zephyr
# write UICR.NFCPINS so P0.09/P0.10 work as GPIOs (persistent in
# UICR once written). The BMP build does not need it (the BMP
# modules already scan that column), so it lives in the
# board-specific conf rather than 7spromax.conf.
CONFIG_NFCT_PINS_AS_GPIOS=y
